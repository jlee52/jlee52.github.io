<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Humanlike locomotion benchmark · documentation</title>
<link rel="stylesheet" href="style.css?v=07dfaa91d4">
<style>
  article { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 20px 20px; overflow-x: auto; }
  article table { border-collapse: collapse; font-size: .88rem; margin: 8px 0 14px; }
  article th, article td { border-bottom: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
  article pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; overflow-x: auto; font-size: .82rem; }
  article h1 { font-size: 1.4rem; } article h2 { font-size: 1.15rem; margin-top: 22px; display: block; }
  nav { margin: 0 0 12px; font-size: .9rem; display: flex; gap: 14px; flex-wrap: wrap; }
</style>
</head>
<body>
<main>
  <nav><a href="./">← Web app</a><a href="doc.html?f=PROFILE">Input profile</a><a href="doc.html?f=ADAPTERS">Motion capture and other sources</a></nav>
  <article id="doc"><p>Loading…</p></article>
</main>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
  // Renders one of the documents copied into docs/ by scripts/build_web.py.
  const name = (new URLSearchParams(location.search).get("f") || "PROFILE").replace(/[^A-Za-z]/g, "");
  fetch(`docs/${name}.md`).then((r) => { if (!r.ok) throw new Error(`docs/${name}.md: ${r.status}`); return r.text(); })
    .then((md) => {
      document.getElementById("doc").innerHTML = marked.parse(md);
      document.title = (md.match(/^# (.+)$/m) || [, name])[1] + " · humanlike";
    })
    .catch((e) => { document.getElementById("doc").textContent = String(e); });
</script>
</body>
</html>
